<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Scanner &amp; Solver</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Sudoku Scanner &amp; Solver</h1>
    <p class="sub">Upload a photo of a puzzle, or type the values in, then solve.</p>

    <div id="board" class="board" aria-label="Sudoku grid"></div>

    <div id="status" class="status" role="status"></div>

    <div class="controls">
      <label class="btn file-btn">
        Upload photo
        <input type="file" id="file" accept="image/*" hidden>
      </label>
      <button class="btn primary" id="solve">Solve</button>
      <button class="btn" id="clear">Clear</button>
    </div>

    <p class="legend">
      <span class="swatch given"></span> your values
      <span class="swatch solved"></span> solved
    </p>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
